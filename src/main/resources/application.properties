spring.application.name=marketplace-desafio-api
server.port=${SERVER_PORT:8082}

# Profile ativo por padrão (h2 para testes sem senha / postgres para produção/pgAdmin)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Conexão PostgreSQL (usada quando o profile ativo for postgres ou quando DB_URL for configurado)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marketplace_desafio}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Configuração didática. As entidades podem criar ou atualizar as tabelas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger e OpenAPI.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# BCrypt e JWT.
security.password.bcrypt-strength=${BCRYPT_STRENGTH:12}
security.jwt.secret=${JWT_SECRET:c2VncmVkby1qd3QtZGlkYXRpY28tMzItYnl0ZXMtMTIzNDU2Nzg=}
security.jwt.issuer=${JWT_ISSUER:marketplace-desafio-api}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

server.error.include-message=always
